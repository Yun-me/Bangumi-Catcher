[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bangumi-catcher"
version = "4.0.0"
description = "本地优先的 Bangumi 收藏工作台：在线同步、离线探索与可视化分析"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Bangumi Catcher Contributors" }]
keywords = ["bangumi", "anime", "data-analysis", "gui", "pyside6"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
    "eval-type-backport>=0.2",
    "diskcache>=5.6",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
    "jinja2>=3.1",
    "PySide6>=6.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.9",
    "mypy>=1.10",
    "build>=1.2",
    "tomli>=2; python_version < '3.11'",
]
packaging = ["pyinstaller>=6"]

[project.scripts]
bangumi-catcher = "bangumi_catcher.ui.app:main"
bangumi-catcher-gui = "bangumi_catcher.ui.app:main"
bangumi-catcher-cli = "bangumi_catcher.cli:main"

[project.urls]
Homepage = "https://github.com/Yun-me/Bangumi-Catcher"
Repository = "https://github.com/Yun-me/Bangumi-Catcher"
Issues = "https://github.com/Yun-me/Bangumi-Catcher/issues"
Changelog = "https://github.com/Yun-me/Bangumi-Catcher/blob/main/CHANGELOG.md"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["bangumi_catcher*"]

[tool.setuptools.package-data]
bangumi_catcher = ["templates/*.j2", "py.typed"]

# ---------------------------------------------------------------------------
# Ruff: linting and formatting
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 110
target-version = "py39"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "E501",   # line length is handled by the formatter / soft limit
    "RUF001", # Chinese punctuation is intentional in user-facing strings
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B", "E402"]
"scripts/*" = ["B"]

[tool.ruff.lint.isort]
known-first-party = ["bangumi_catcher", "tests"]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q --strict-markers"
markers = [
    "ui: needs a Qt application (runs headless with QT_QPA_PLATFORM=offscreen)",
    "network: may open a real network connection (skipped by default in CI)",
    "slow: takes longer than a second",
]

# ---------------------------------------------------------------------------
# coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["bangumi_catcher"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

# ---------------------------------------------------------------------------
# mypy (scoped to the Qt-free layers so it stays fast and actionable)
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.9"
mypy_path = "src"
files = [
    "src/bangumi_catcher/core",
    "src/bangumi_catcher/api",
    "src/bangumi_catcher/charts",
    "src/bangumi_catcher/reporting",
    "src/bangumi_catcher/services",
    "src/bangumi_catcher/observability.py",
]
check_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
exclude = ["src/bangumi_catcher/templates"]
