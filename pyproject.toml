[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bangumi-catcher"
version = "1.2.2"
description = "Bangumi 用户动画收藏批量抓取与数据分析 —— 桌面 GUI 工具"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Bangumi Catcher Contributors" }]
keywords = ["bangumi", "anime", "data-analysis", "gui"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
    "eval-type-backport>=0.2",
    "diskcache>=5.6",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
    "jinja2>=3.1",
    "PySide6>=6.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4", "ruff>=0.5", "pyinstaller>=6"]

[project.scripts]
bangumi-catcher = "bangumi_catcher.gui:main"
bangumi-catcher-gui = "bangumi_catcher.gui:main"

[project.urls]
Homepage = "https://github.com/Yun-me/Bangumi-Catcher"
Repository = "https://github.com/Yun-me/Bangumi-Catcher"
Issues = "https://github.com/Yun-me/Bangumi-Catcher/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["bangumi_catcher*"]

[tool.ruff]
line-length = 110
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = ["E501"]  # 行宽交给 line-length 软约束，长字符串/URL 不强行换行

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B", "E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
