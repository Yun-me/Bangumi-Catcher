name: Bug report
description: 报告一个可复现的问题
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请先搜索已有 issue；安全/隐私问题请不要公开贴出个人信息。

  - type: input
    id: os
    attributes:
      label: 操作系统
      placeholder: Windows 11 / macOS 14 / Ubuntu 24.04
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python 版本
      placeholder: 3.9.13 / 3.12.7
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: 安装方式
      options:
        - pip install -e ".[dev]"
        - pip install bangumi-catcher
        - 打包版 (dist/BangumiCatcher)
        - 其他
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 尽量给出最小步骤（用户名可替换为示例）
      placeholder: |
        1. 打开应用
        2. 输入 ...
        3. 点击 ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 包括错误文本、状态栏信息或截图
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志（可选）
      description: "`bash python -m bangumi_catcher.cli -v ...` 或「工具 → 运行日志」；请隐去隐私信息。"
      render: text

  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 我已搜索过已有 issue
          required: true
        - label: 这不是私有收藏访问/绕过权限的问题
          required: true
