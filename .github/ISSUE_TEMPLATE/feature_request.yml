name: Feature request
description: 建议一个新功能或改进
title: "[feat] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 描述使用场景与痛点，而不是直接给实现方案。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 可选。说明你希望它出现在哪里（GUI / CLI / 导出 / 配置）。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 你考虑过的替代做法或现有 workaround。

  - type: dropdown
    id: area
    attributes:
      label: 影响范围
      multiple: true
      options:
        - UI / 交互
        - 抓取 / 网络
        - 分析 / 图表
        - 导出 / 快照
        - CLI
        - 文档 / 开发体验
        - 打包 / 发布

  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 我已搜索过已有 issue/discussion
          required: true
        - label: 该功能不涉及修改远程收藏或绕过权限
          required: true
