name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint and type check
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: "offscreen"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check src tests scripts

      - name: Ruff format check
        run: ruff format --check src tests scripts

      - name: Mypy
        run: mypy

  test:
    name: Test (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Pin Ubuntu 24.04: ubuntu-latest moved to 26.04, where setup-python
        # has no prebuilt Python 3.9. Windows provides 3.9 natively.
        os: [ubuntu-24.04, windows-latest]
        python-version: ["3.9", "3.13"]
    env:
      QT_QPA_PLATFORM: "offscreen"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install Linux headless Qt runtime
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 fonts-noto-cjk

      - name: Test
        run: pytest -q

  package:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build sdist and wheel
        run: python -m build

      - name: Verify wheel contents
        run: |
          python - <<'PY'
          import glob
          import zipfile

          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          required = ("bangumi_catcher/templates/report.html.j2", "bangumi_catcher/py.typed")
          for suffix in required:
              assert any(name.endswith(suffix) for name in names), (suffix, names)
          assert not any(name.startswith("tests/") for name in names), "tests leaked into wheel"
          print(f"wheel OK: {wheel} ({len(names)} entries)")
          PY

      - name: Import the built wheel without dependencies
        run: |
          python -m pip install --no-deps dist/*.whl
          python -c "import bangumi_catcher; print('imported', bangumi_catcher.__version__)"

      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
          if-no-files-found: error
