name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  distributions:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  bundle:
    name: Windows desktop bundle (optional)
    # Enable by setting the repository variable BUILD_DESKTOP_BUNDLE=true.
    if: vars.BUILD_DESKTOP_BUNDLE == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install packaging dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,packaging]"

      - name: Build PyInstaller bundle
        run: python scripts/build.py

      - name: Zip bundle
        shell: pwsh
        run: Compress-Archive -Path dist/BangumiCatcher/* -DestinationPath dist/BangumiCatcher-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-bundle
          path: dist/BangumiCatcher-windows.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [distributions]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
